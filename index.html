<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="40-question responsive questionnaire app">
  <title>Insurance Questionnaire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="quiz-title">
    <header class="header">
      <div>
        <p class="eyebrow">QUESTIONNAIRE</p>
        <h1 id="quiz-title">Insurance Knowledge Quiz</h1>
      </div>
      <button id="restart-top" class="text-button" type="button">Restart</button>
    </header>

    <section id="start-screen" class="card">
      <h2>Ready to begin?</h2>
      <p>40 questions • 30 multiple choice • 10 True/False</p>
      <ul>
        <li>70% is the passing mark.</li>
        <li>You can move backward and change answers.</li>
        <li>A 30-minute timer is included.</li>
      </ul>
      <button id="start-btn" class="primary" type="button">Start Quiz</button>
    </section>

    <section id="quiz-screen" class="card" hidden>
      <div class="quiz-meta">
        <span id="progress" aria-live="polite">Question 1 of 40</span>
        <span id="timer" aria-live="polite">30:00</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>

      <div class="question-area">
        <span id="question-type" class="badge">Multiple Choice</span>
        <h2 id="question-number">Question 1</h2>
        <p id="question-text" tabindex="-1"></p>
        <div id="options" class="options" role="radiogroup" aria-label="Answer choices"></div>
      </div>

      <div class="controls">
        <button id="prev-btn" class="secondary" type="button">Previous</button>
        <button id="next-btn" class="primary" type="button">Next</button>
      </div>
    </section>

    <section id="result-screen" class="card" hidden>
      <div class="result-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">RESULT</p>
      <h2 id="result-title">Quiz Complete</h2>
      <div class="score" id="score-text"></div>
      <p id="result-detail"></p>
      <div id="review-answers" class="review"></div>
      <button id="retake-btn" class="primary" type="button">Take Quiz Again</button>
    </section>

    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
